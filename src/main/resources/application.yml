server:
  port: 8081

spring:
  application:
    name: authcore-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authcore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    # Credenciales SOLO por variables de entorno: nunca se escriben en el repositorio.
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

authcore:
  jwt:
    # Clave COMPARTIDA con domain-service-turnos, en Base64 (minimo 48 bytes => HS384).
    # Sin esta variable la aplicacion no arranca, a proposito.
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
