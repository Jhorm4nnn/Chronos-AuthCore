server:
  port: 8081

spring:
  application:
    name: authcore-service
  # Para ejecutar en local (por ejemplo desde NetBeans): si existe un archivo .env en la carpeta del proyecto,
  # sus valores (CLAVE=valor) se usan como configuración. Ese archivo está en .gitignore y nunca se sube.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authcore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    # Credenciales SOLO por variables de entorno: nunca se escriben en el repositorio.
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

authcore:
  jwt:
    # Clave COMPARTIDA con domain-service-turnos, en Base64 (minimo 48 bytes => HS384).
    # Sin esta variable la aplicacion no arranca, a proposito.
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    # Origenes que pueden llamar a la API desde un navegador (la interfaz web del Domain Service).
    allowed-origins: ${AUTHCORE_CORS_ORIGINS:*}
  admin:
    # Administrador inicial: se crea al arrancar si no existe. Sin estas variables no se crea ninguno.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
