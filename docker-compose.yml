# Solo para desarrollo local de AuthCore. El despliegue completo de Chronos está en
# Chronos-Domain-Service/despliegue/docker-compose.yml.
# Los valores salen del archivo .env (ignorado por git).
services:
  authcore-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: authcore_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: authcore
      MYSQL_PASSWORD: ${AUTHCORE_DB_PASSWORD:?Define AUTHCORE_DB_PASSWORD en .env}
    volumes:
      - authcore-db-data:/var/lib/mysql

  authcore-service:
    build: .
    depends_on:
      - authcore-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://authcore-db:3306/authcore_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: authcore
      SPRING_DATASOURCE_PASSWORD: ${AUTHCORE_DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Define JWT_SECRET_BASE64 en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"

volumes:
  authcore-db-data:
